<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ai VPN Admin{% endblock %}</title>
<style>
  :root {
    --bg: #0d0f12;
    --card: #15181d;
    --border: #23272e;
    --text: #e8e8ea;
    --muted: #8a8f98;
    --accent: #6ea8fe;
    --green: #3ddc84;
    --red: #ff5c5c;
    --yellow: #ffc857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; flex: 1;
  }
  .stat-card .value { font-size: 28px; font-weight: 700; }
  .stat-card .label { color: var(--muted); font-size: 13px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  form { display: inline; }
  button, input[type=submit] {
    background: #23272e; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #2c313a; }
  .btn-danger:hover { background: #3a1f1f; border-color: var(--red); }
  .btn-primary { background: var(--accent); color: #0d0f12; border: none; font-weight: 600; }
  .btn-primary:hover { opacity: 0.9; }
  input[type=number] {
    width: 56px; background: #0d0f12; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px; font-size: 12px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #0d0f12; color: var(--text); font-size: 14px; margin-bottom: 12px;
  }
  .error { color: var(--red); font-size: 13px; margin-bottom: 12px; }
  a { color: var(--accent); text-decoration: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
